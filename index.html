<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi d'entraînement</title>
<style>
:root{--bg:#eef1ee;--card:#fff;--ink:#1b2a2f;--mute:#5d6e72;--line:#d5dcd8;--c-route:#2b6f8f;--c-trail:#c4572b;--c-velo:#d9a21b;--c-ht:#d16a9c;--c-vtt:#7a8f2e;--c-nat:#3fa7a0;--c-renfo:#7d5ba6;--c-autre:#8a8f91}
@media(prefers-color-scheme:dark){:root{--bg:#121a1c;--card:#1a2427;--ink:#e6ecea;--mute:#93a5a8;--line:#2c3a3e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Avenir Next",Seravek,"Segoe UI",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
h1{font:700 30px/1.1 Georgia,"Iowan Old Style",serif;margin:0 0 4px}
h2{font:600 18px Georgia,serif;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font:700 26px Georgia,serif}.kpi span{color:var(--mute);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select,input,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button:hover,.chip.on{background:var(--ink);color:var(--bg)}
:focus-visible{outline:2px solid var(--c-route);outline-offset:2px}
.chip{border-radius:99px;padding:3px 12px;font-size:13px}
.chip.big{padding:5px 14px;font-size:15px;font-weight:600}#years{margin:12px 0 10px}
.chip small{margin-left:4px;opacity:.7;font-weight:400}.chip.off:not(.on){color:var(--mute);border-style:dashed}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{cursor:pointer;color:var(--mute);font-weight:600;user-select:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.t{white-space:normal;min-width:200px}
.cm{color:var(--mute);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
svg text{fill:var(--mute);font-size:11px}
svg .hit{fill:transparent}#chart .hit.on{fill:var(--line);fill-opacity:.45}#chart rect:not(.hit),#chart text,#chart line{pointer-events:none}
.tip{position:fixed;z-index:10;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;min-width:170px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tip b{display:block;margin-bottom:4px}.tip .r{display:flex;gap:14px;justify-content:space-between;align-items:baseline}.tip .v{font-variant-numeric:tabular-nums;white-space:nowrap}
.tip .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;font-weight:700}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
details summary{cursor:pointer;font:600 18px Georgia,serif}
.rec li{margin:4px 0}
[hidden]{display:none!important}
td button{padding:1px 8px}td:last-child{white-space:nowrap}
.badge{display:inline-block;border:1px solid var(--mute);border-radius:99px;padding:0 7px;margin-right:6px;font-size:11px;font-weight:700;white-space:nowrap}
.flag{opacity:.3}.flag:hover,.flag.on{opacity:1}.flag.on{background:var(--ink);color:var(--bg)}
.chk{display:flex;align-items:center;gap:6px;font-size:14px}.chk input{width:16px;height:16px;padding:0}
tr.st td{font-weight:700;border-bottom:2px solid var(--line)}
tr.yr td{font:700 17px Georgia,serif;padding-top:18px;border-bottom:2px solid var(--ink)}.fold,.fold:hover{border:0;background:none;color:inherit;padding:0;font:inherit;cursor:pointer}.fold:hover{text-decoration:underline}
tr.yr small{font:400 13px "Avenir Next",Seravek,"Segoe UI",system-ui,sans-serif;color:var(--mute);margin-left:8px}
td input[type=checkbox]{width:16px;height:16px;padding:0;vertical-align:middle;cursor:pointer}button:disabled{opacity:.55;cursor:default;background:var(--card);color:inherit}
.sync{margin:10px 0 0;font-size:14px}.sync button{padding:3px 12px}#ghbox{margin-top:10px}
/* Lecture seule (visiteur du lien) : aucune commande de modification */
body.ro .flag,body.ro [data-e],body.ro td input[type=checkbox],body.ro #merge,body.ro #add,body.ro #impBar,body.ro #help,body.ro #mode{display:none!important}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
/* ---- Bilan à imprimer : toujours sur fond blanc, quelle que soit l'apparence (claire ou sombre) de la page ---- */
body.bk{background:#e3e7e4}body.bk main{display:none}
#book{--bg:#fff;--card:#fff;--ink:#1b2a2f;--mute:#5d6e72;--line:#d5dcd8;color:var(--ink);font-size:13px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bktools{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 16px;background:#1b2a2f;color:#fff}
.bktools .cm{color:#c9d3d0}.bktools select,.bktools button{background:#fff;color:#1b2a2f}.bktools button:hover{background:#d5dcd8;color:#1b2a2f}
#bkBody{max-width:794px;margin:0 auto;padding:16px 0 40px}
.pg{background:#fff;padding:46px 50px;margin:0 0 16px;box-shadow:0 1px 6px rgba(0,0,0,.18)}
.pg h2{font:700 30px Georgia,serif;margin:0 0 10px;padding-bottom:6px;border-bottom:3px solid var(--ink)}
.pg h3{font:600 17px Georgia,serif;margin:22px 0 8px;break-after:avoid}
.pg h4{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:600 14px Georgia,serif;margin:18px 0 2px;padding-bottom:3px;border-bottom:1px solid var(--ink);break-after:avoid}
.pg h4 span{font:400 12px "Avenir Next",Seravek,"Segoe UI",system-ui,sans-serif;color:var(--mute)}
.pg table{font-size:12px}.pg th,.pg td{padding:4px 6px}.pg th{cursor:default}.pg tr{break-inside:avoid}.pg td.t{min-width:150px}
.pg .kpis{grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 8px}.pg .kpi{padding:8px 10px}.pg .kpi b{font-size:20px}
.pg .fig{margin:14px 0 4px;break-inside:avoid}.pg .blk{break-inside:avoid}.pg thead{break-after:avoid}.pg tbody tr:first-child{break-before:avoid}.pg .fig .bar{margin:0;font-size:12px}.pg .rec{margin:0;padding-left:20px}
.cover{min-height:1030px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.cover h1{font-size:46px;margin:0 0 10px}.cover .who{font:italic 20px Georgia,serif;margin:0;min-height:26px}.cover .per{font:700 28px Georgia,serif;margin:36px 0 26px}.cover .kpi{text-align:left}
[contenteditable]{border-radius:4px;outline:1px dashed transparent;outline-offset:4px}[contenteditable]:hover,[contenteditable]:focus{outline-color:var(--mute)}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--mute)}
@page{size:A4;margin:14mm 13mm}
@media print{
  body.bk{background:#fff}.bktools{display:none!important}#bkBody{max-width:none;padding:0}
  .pg{box-shadow:none;padding:0;margin:0;break-before:page}.pg:first-child{break-before:auto}.newpage{break-before:page}
  .cover{min-height:255mm}[contenteditable]:empty::before{content:""}
}
</style>
</head>
<body>
<main>
<div class="head"><h1>Suivi d'entraînement</h1><button id="bkOpen">BILAN</button></div>
<div class="bar sync" id="sync" hidden><span id="syncTxt"></span><button id="pub">Réessayer</button></div>
<div class="bar" id="years" role="tablist" aria-label="Année affichée"></div>
<p class="sub" id="sub"></p>
<div class="kpis" id="kpis"></div>

<div class="card" id="cChart">
  <h2 id="hChart">Volume par mois</h2>
  <div class="bar" id="metric"></div>
  <div class="wrap"><svg id="chart" width="100%" viewBox="0 0 720 240" role="img" aria-label="Volume par sport"></svg></div>
  <div class="bar" id="legend"></div>
</div>

<div class="grid2" id="cStats">
  <div class="card"><h2 id="hBil">Bilan par sport</h2><div class="wrap"><table id="bySport"></table></div></div>
  <div class="card"><h2 id="hRec">Faits marquants</h2><ul class="rec" id="rec"></ul></div>
</div>

<div class="card">
  <h2 id="hList">Séances</h2>
  <div class="bar" id="tabs" role="tablist" aria-label="Mois affiché"></div>
  <div class="bar">
    <select id="fSport"></select>
    <input id="fText" type="search" placeholder="Rechercher (séance, lieu…)" aria-label="Rechercher">
    <span class="cm" id="count"></span>
    <button id="foldAll" hidden></button>
    <button id="merge" disabled title="Cochez au moins deux séances dans la liste">Fusionner</button>
    <span class="cm" id="lmsg" role="status"></span>
  </div>
  <div class="wrap"><table id="tbl"></table></div>
</div>

<div class="card">
  <details id="addbox">
    <summary id="boxTitle">Ajouter, modifier ou importer des séances</summary>
    <p class="cm" id="mode" style="margin:12px 0 0" hidden></p>
    <form id="add" style="margin-top:12px">
      <input type="date" name="date" required aria-label="Date">
      <select name="sport" aria-label="Sport"></select>
      <input name="duree" placeholder="Durée (h:mm:ss)" pattern="\d+:\d\d(:\d\d)?" required>
      <input name="distance" type="number" step="0.01" min="0" placeholder="Distance (km)">
      <input name="dplus" type="number" min="0" placeholder="D+ (m)">
      <input name="seance" placeholder="Séance">
      <input name="lieu" placeholder="Lieu">
      <input name="commentaire" placeholder="Commentaire">
      <label class="chk"><input type="checkbox" name="course"> Course officielle</label>
      <button id="ok">Ajouter</button><button type="button" id="del" hidden>Supprimer</button><button type="button" id="split" hidden>Séparer</button><button type="button" id="cancel" hidden>Annuler</button>
    </form>
    <div class="bar" id="impBar" style="margin-top:12px">
      <label class="cm" for="imp">Compléter depuis un fichier : calendrier Excel (.xlsx) ou export Garmin Connect (Activities.csv)</label>
      <input type="file" id="imp" accept=".xlsx,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
    </div>
    <p class="cm" id="help" style="margin:12px 0 4px">L'import ajoute les séances absentes, sans toucher à celles déjà présentes ; un sport inconnu est créé automatiquement.</p>
    <p class="cm" id="msg" role="status"></p>
    <div id="ghbox">
      <p class="cm" id="fbInfo"></p>
      <p class="cm" id="lockLine" hidden><button type="button" id="lock"></button></p>
      <form id="login" hidden>
        <input name="email" id="logEmail" type="email" placeholder="E-mail du compte" autocomplete="username" required aria-label="E-mail du compte">
        <input name="password" id="logPwd" type="password" placeholder="Mot de passe" autocomplete="current-password" required aria-label="Mot de passe">
        <button id="logBtn">Se connecter</button>
      </form>
      <p class="cm" id="logged" hidden><span id="who"></span> <button type="button" id="logout">Se déconnecter</button></p>
      <p class="cm" id="logMsg" role="status"></p>
    </div>
  </details>
</div>
<div class="tip" id="tip" hidden></div>
</main>
<div id="book" hidden>
  <div class="bktools">
    <button id="bkClose">← Retour au suivi</button>
    <label class="cm">Contenu <select id="bkScope" aria-label="Années du bilan"></select></label>
    <label class="chk"><input type="checkbox" id="bkDetail" checked> Détail des séances</label>
    <button id="bkPrint">Imprimer ou enregistrer en PDF</button>
    <span class="cm" id="bkInfo"></span>
  </div>
  <div id="bkBody"></div>
</div>

<script>
// Les séances sont enregistrées dans ce navigateur (localStorage). Distance en km, sauf natation en mètres.
// Sports de base. Tout autre nom de sport rencontré dans les séances (type d'activité inconnu à l'import) devient un sport à part entière.
const BASE = {"course route":["Course route","--c-route"],"trail":["Trail","--c-trail"],"velo route":["Vélo route","--c-velo"],"home trainer":["Home trainer","--c-ht"],"vtt":["VTT","--c-vtt"],"natation":["Natation","--c-nat"],"renfo":["Renfo","--c-renfo"],"ski rando":["Ski rando","--c-autre"],"randonnée":["Randonnée","--c-autre"]};
const MSHORT = ["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];
const MONTHS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const KEY = "suivi-2026-seances", OLD = "suivi-2026-modifs";
const $ = id => document.getElementById(id);
let SPORTS = Object.create(null); // sports de base + sports créés, recalculé par syncSports() à chaque affichage
const norm = t => String(t??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const label = k => k.charAt(0).toUpperCase()+k.slice(1);
const sportLabel = k => (SPORTS[k]||[label(k)])[0], name = k => esc(sportLabel(k)), col = k => `var(${(SPORTS[k]||[0,"--c-autre"])[1]})`;
// Nom lu dans un fichier → sport existant (sans tenir compte des accents ni des majuscules), sinon clé d'un nouveau sport
const sportKey = t => { const n = norm(t); return Object.keys(SPORTS).find(k=>norm(k)===n) || String(t??"").trim().toLowerCase().replace(/\s+/g," ") || "autre"; };
function syncSports(){
  const S = Object.assign(Object.create(null), BASE);
  for(const o of seances) if(!S[o.sport]) S[o.sport] = [label(o.sport),"--c-autre"]; // les sports créés partagent le gris « autres »
  const changed = Object.keys(S).join("\n") !== Object.keys(SPORTS).join("\n"); SPORTS = S;
  if(!changed) return;
  const opts = Object.keys(S).map(k=>`<option value="${esc(k)}">${name(k)}</option>`).join("");
  const fill = (el,html) => { const v = el.value; el.innerHTML = html; el.value = S[v] ? v : el.options[0].value; }; // garde le choix en cours
  fill($("fSport"), `<option value="">Tous les sports</option>`+opts); fill($("add").elements.sport, opts);
}
const load = () => { try {
    const a = JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(a)) return a;
    const p = JSON.parse(localStorage.getItem(OLD)); // séances saisies avec l'ancienne version de la page
    return p && p.up ? Object.values(p.up) : [];
  } catch { return []; } };
let rev = 0; // numéro de la dernière modification locale (sert à l'envoi automatique)
const save = () => { computePend(); rev++; const a = jset(KEY, seances), b = jset(PEND, pend); return a && b; }; // la liste complète + les modifications non publiées
const parseDur = d => { const p = String(d).split(":").map(Number); return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+(p[1]||0); };
const toObj = o => ({id:o.id,date:o.date,sport:o.sport,sec:parseDur(o.duree),dist:o.distance||0,dplus:o.dplus||0,title:o.seance||"",comment:o.commentaire||"",place:o.lieu||"",y:+o.date.slice(0,4),m:+o.date.slice(5,7)-1,parts:(o.parts||[]).length,race:!!o.course});

// ---- Données en ligne ----
// La version en ligne (base) est lue dans la base Firebase réglée plus bas, par tous ceux qui ouvrent le lien.
// Sans base réglée, tout reste dans ce navigateur.
// Chaque navigateur ne retient que ses modifications non envoyées (pend) par rapport à cette version en ligne.
const PEND = "suivi-modifs", CACHE = "suivi-en-ligne", AUTH = "suivi-compte", EDIT = "suivi-modifiable";
const jget = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const jset = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
// Une séance sans identifiant en reçoit un, stable, fabriqué à partir de son contenu.
function withIds(a){ const seen = new Set();
  return a.filter(o=>o && typeof o.date==="string" && /^\d{4}-\d\d-\d\d/.test(o.date) && o.sport && o.duree).map(o=>{ let id = o.id;
    if(!id){ let h = 5381; for(const c of [o.date,o.sport,o.duree,o.distance,o.seance,o.lieu].join("|")) h = (h*33 ^ c.charCodeAt(0)) >>> 0; id = "h"+h.toString(36); }
    id = fbKey(id); while(seen.has(id)) id += "b"; seen.add(id); return o.id===id ? o : {...o, id}; }); }
const canon = o => JSON.stringify(o, [...new Set(Object.keys(o).concat((o.parts||[]).flatMap(Object.keys)))].sort()); // comparaison insensible à l'ordre des champs
const applyPend = (b,p) => { if(p.replace) return seances; const del = new Set(p.del), ids = new Set(b.map(o=>o.id));
  return b.filter(o=>!del.has(o.id)).map(o=>p.up[o.id]||o).concat(Object.values(p.up).filter(o=>!ids.has(o.id))); };
let base = (c => c && Array.isArray(c.seances) ? c.seances : [])(jget(CACHE)); // dernière version en ligne connue de ce navigateur
let online = null;        // {maj, n} une fois la version en ligne lue pendant cette visite
let pend = jget(PEND);    // {up:{id:séance}, del:[id]} ; replace:true = séances d'avant la mise en ligne, pas encore rapprochées de la version en ligne
const fbKey = id => String(id).replace(/[.$#\[\]\/\x00-\x1f\x7f]/g,"_"); // Firebase refuse . $ # [ ] / dans une clé
let seances = load().map((o,i)=>o.id ? (fbKey(o.id)===o.id ? o : {...o,id:fbKey(o.id)}) : {...o,id:"m"+i});
if(pend && !pend.replace) seances = applyPend(base, pend);
else if(seances.length){ pend = {up:{},del:[],replace:true}; jset(EDIT, true); } // ce navigateur a déjà des séances : c'est celui du propriétaire
else { seances = base.slice(); pend = {up:{},del:[]}; }
function computePend(){
  if(pend.replace) return;
  const bm = new Map(base.map(o=>[o.id,canon(o)])), ids = new Set(seances.map(o=>o.id));
  pend.up = {}; for(const o of seances) if(bm.get(o.id)!==canon(o)) pend.up[o.id] = o;
  pend.del = base.filter(o=>!ids.has(o.id)).map(o=>o.id);
}
const nPend = () => pend.replace ? seances.length : Object.keys(pend.up).length + pend.del.length;
let all = [], data = [], sort = {k:"date",d:-1}, metric = "h"; // all : toutes les séances ; data : celles de l'année affichée
let year = null;  // onglet du haut : "" = toutes les années, "races" = courses officielles, sinon l'année ; null = pas encore choisi (dernière année qui a des séances)
const multi = () => typeof year !== "number"; // vue sur plusieurs années (« Toutes les années » ou « Courses officielles »)
const closed = new Set(); // années repliées dans l'onglet « Courses officielles »
const picked = new Set(); // identifiants des séances cochées dans la liste (pour les fusionner)
let nav = false;   // le visiteur a choisi lui-même un onglet d'année ou de mois
let month = null; // sous-onglet : "" = toute l'année, 0 à 11 = un mois, null = pas encore choisi (dernier mois qui a des séances)

const hms = s => { s=Math.round(s); return `${Math.floor(s/3600)}h${String(Math.floor(s%3600/60)).padStart(2,"0")}`; };
const mmss = s => `${Math.floor(s/60)}'${String(Math.round(s%60)).padStart(2,"0")}`;
const km = s => s.sport==="natation" ? s.dist/1000 : s.dist||0;
function pace(s){
  if(!s.sec||!s.dist) return "";
  if(s.sport==="natation") return mmss(s.sec/(s.dist/100))+"/100m";
  if(s.sport==="course route"||s.sport==="trail") return mmss(s.sec/s.dist)+"/km";
  if(s.sport==="renfo") return "";
  return (s.dist/(s.sec/3600)).toFixed(1)+" km/h";
}
const DF = new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"short"}), DFY = new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"short",year:"numeric"});
const fdate = d => (multi() ? DFY : DF).format(new Date(d+"T12:00")); // avec l'année dans les vues sur plusieurs années
const sum = (a,f) => a.reduce((t,x)=>t+f(x),0);

function years(){
  const n = {}; all.forEach(s=>n[s.y]=(n[s.y]||0)+1);
  const ys = [...new Set([...Object.keys(n).map(Number), ...(multi() ? [] : [year])])].sort((a,b)=>a-b);
  const list = [["","Toutes les années",all.length], ...ys.map(y=>[y,y,n[y]||0]), ["races","Courses officielles",all.filter(s=>s.race).length]];
  $("years").innerHTML = list.map(([v,l,c])=>`<button class="chip big${year===v?" on":""}${c?"":" off"}" role="tab" aria-selected="${year===v}" data-y="${v}">${l}${c?`<small>${c}</small>`:""}</button>`).join("");
  document.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{ const v = b.dataset.y; year = v==="" || v==="races" ? v : +v; month = null; nav = true; render(); document.querySelector(`[data-y="${year}"]`).focus(); });
}
const plur = (n,a,b) => `${n} ${n>1?b:a}`;
// Les quatre chiffres clés d'une liste de séances
const kpiHtml = (list,what="d'entraînement") => [
    [hms(sum(list,s=>s.sec)),what],
    [Math.round(sum(list.filter(s=>s.sport!=="natation"),s=>s.dist||0)).toLocaleString("fr-FR")+" km","parcourus, hors natation"],
    [Math.round(sum(list,s=>s.dplus||0)).toLocaleString("fr-FR")+" m","de dénivelé positif"],
    [Math.round(sum(list.filter(s=>s.sport==="natation"),s=>s.dist)/100)/10+" km","de natation"]

const VAL = {h:s=>s.sec/3600, km:s=>km(s), d:s=>s.dplus||0};
// Graphique empilé d'une liste de séances : un bâton par mois, ou par année si byYear. m : "h", "km" ou "d". suffix : complément du titre des bulles.
function buildChart(list, byYear, m, suffix=""){
  const val = VAL[m];
  // Une couleur par sport principal ; les sports en gris (ski rando, randonnée, sports créés) forment une seule série « Autres sports ».
  const live = Object.keys(SPORTS).filter(k=>list.some(s=>s.sport===k&&val(s)>0)), grey = k => SPORTS[k][1]==="--c-autre", rest = live.filter(grey);
  const series = live.filter(k=>!grey(k)).map(k=>({l:name(k),c:col(k),has:s=>s.sport===k}));
  if(rest.length) series.push({l:rest.length===1 ? name(rest[0]) : `Autres sports (${rest.slice(0,3).map(name).join(", ")}${rest.length>3?"…":""})`, c:"var(--c-autre)", has:s=>rest.includes(s.sport)});
  const y0 = list.reduce((a,s)=>Math.min(a,s.y),9999), y1 = list.reduce((a,s)=>Math.max(a,s.y),0);
  const B = byYear ? Array.from({length:Math.max(0,y1-y0+1)},(_,i)=>({short:String(y0+i),long:String(y0+i),a:list.filter(s=>s.y===y0+i)}))
                   : MONTHS.map((mn,i)=>({short:MSHORT[i],long:mn,a:list.filter(s=>s.m===i)}));
  const tot = B.map(x=>sum(x.a,val));
  const max = Math.max(1,...tot), W=720,H=240,b=26,t=14,step=(W-40)/Math.max(1,B.length),bw=Math.min(36,step*.7);
  // Bulle au survol d'une colonne : détail par sport (du haut de la pile vers le bas) puis total
  const fmt = v => m==="h" ? hms(v*3600) : (v<100 ? Math.round(v*10)/10 : Math.round(v)).toLocaleString("fr-FR")+(m==="km" ? " km" : " m");
  const order = [...live.filter(k=>!grey(k)), ...rest].reverse();
  const tips = B.map(({long,a},i)=>tot[i]>0 ? `<b>${long}${suffix}</b>`
    + order.map(k=>[k,sum(a.filter(s=>s.sport===k),val)]).filter(x=>x[1]>0).map(([k,v])=>`<div class="r"><span><i class="dot" style="background:${col(k)}"></i>${name(k)}</span><span class="v">${fmt(v)}</span></div>`).join("")
    + `<div class="r tot"><span>Total · ${a.length} séance${a.length>1?"s":""}</span><span class="v">${fmt(tot[i])}</span></div>` : "");
  let g = "";
  B.forEach(({short,a},i)=>{
    let y = H-b; const x = 40+i*step+(step-bw)/2;
    g+=`<rect class="hit" data-i="${i}" x="${40+i*step}" y="0" width="${step}" height="${H}"/>`;
    series.forEach(({c,has})=>{
      const v = sum(a.filter(has),val), h = v/max*(H-b-t);
      if(h>0){ y-=h; g+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${c}"/>`; }
    });
    if(tot[i]>0) g+=`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle">${Math.round(tot[i]*(m==="h"?10:1))/(m==="h"?10:1)}</text>`;
    g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${short}</text>`;
  });
  g+=`<line x1="36" x2="${W}" y1="${H-b}" y2="${H-b}" stroke="var(--line)"/>`;
  return {svg:g, legend:series.map(({l,c})=>`<span><i class="dot" style="background:${c}"></i>${l}</span>`).join(""), tips};
}

const GROUPS = [["Total course à pied",["course route","trail"]],["Total vélo",["velo route","home trainer","vtt"]]];
function bilanHtml(view){
  const line = (lab,a,k,cls) => { const d = sum(a,km), t = sum(a,s=>s.sec), dp = sum(a,s=>s.dplus||0), p = pace({sport:k,sec:t,dist:k==="natation"?d*1000:d});

  const one = k => { const a = view.filter(s=>s.sport===k); return a.length ? line(`<i class="dot" style="background:${col(k)}"></i>${name(k)}`,a,k) : ""; };
  const grouped = new Set(GROUPS.flatMap(g=>g[1]));

function recItems(list, df){
  const best = (f,flt=()=>true) => list.filter(flt).reduce((a,s)=>!a||f(s)>f(a)?s:a,null);
  const out = [];
  const add = (label,s,v) => s&&out.push(`<li><b>${label}</b> : ${v} — ${esc(s.title)||name(s.sport)} (${df.format(new Date(s.date+"T12:00"))}${s.place?", "+esc(s.place):""})</li>`);
  let s = best(s=>s.dist,s=>s.sport==="trail"); add("Plus longue sortie trail",s,s&&s.dist+" km");
  s = best(s=>s.dplus||0); add("Plus gros dénivelé",s,s&&s.dplus.toLocaleString("fr-FR")+" m");
  s = best(s=>s.dist,s=>s.sport==="course route"); add("Plus longue course route",s,s&&s.dist+" km");
  s = best(s=>s.dist,s=>s.sport==="velo route"); add("Plus longue sortie vélo",s,s&&s.dist+" km");
  s = best(s=>s.dist,s=>s.sport==="natation"); add("Plus longue nage",s,s&&s.dist+" m");
  s = best(s=>s.dist/s.sec,s=>s.sport==="course route"&&s.dist>=9.9); add("Meilleure allure (≥ 10 km)",s,s&&pace(s));
  return out.join("");
}

async function fbWrite(body){ // n'écrit que les chemins cités : rien d'autre n'est touché dans la base
  const t = await token(), r = await fetch(`${FB}${ROOT}.json${t ? "?auth="+encodeURIComponent(t) : ""}`, {method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if(r.status===401 || r.status===403) throw Object.assign(new Error(auth ? `le compte ${auth.email} n'a pas le droit d'écrire dans la base (vérifiez son identifiant UID dans les règles Firebase)` : "la base en ligne demande une connexion pour enregistrer"), {login:true});
  if(!r.ok) throw new Error(r.status===404 ? "base Firebase introuvable (adresse incorrecte)" : "Firebase a répondu "+r.status);
}
// Version en ligne : contenu de /suivi dans la base (null si aucune base n'est réglée ou si elle est injoignable)
async function fetchOnline(){
  if(!FB) return null;
  try { const r = await fetch(`${FB}${ROOT}.json`, {cache:"no-store"}); if(!r.ok) return null; const j = await r.json() || {};
    return {list:withIds(Object.entries(j.seances||{}).map(([id,o])=>o && typeof o==="object" ? {...o,id} : null)), maj:j.maj||null}; }
  catch { return null; }
}
function setBase(list, maj){ base = list; online = {maj, n:list.length}; jset(CACHE,{maj,seances:list}); }
async function refresh(){
  const r = await fetchOnline(); if(!r) return syncBar();
  computePend(); setBase(r.list, r.maj);
  if(pend.replace){
    // Séances d'avant la mise en ligne : on les rapproche de la version en ligne sans rien y supprimer. Celles qui y sont déjà
    // (même identifiant, ou même séance au sens de l'import) ne sont pas ajoutées une seconde fois ; les autres partent en ligne.
    const mine = new Set(seances.map(o=>o.id)), on = new Set(base.map(o=>o.id)), pool = base.filter(o=>!mine.has(o.id)).flatMap(o=>[o, ...(o.parts||[])]); // les morceaux d'une séance fusionnée comptent aussi
    const keep = seances.filter(o=>{ if(on.has(o.id)) return true; const k = pool.findIndex(x=>same(x,o)); if(k<0) return true; pool.splice(k,1); return false; });
    const kept = new Set(keep.map(o=>o.id)); seances = base.filter(o=>!kept.has(o.id)).concat(keep); pend = {up:{},del:[]};
  } else seances = applyPend(base, pend);
  save();
  if(!nav && !editing) year = month = null; // tant que rien n'a été choisi : dernière année et dernier mois remplis
  render();
}
// Envoi automatique : seules les séances ajoutées, modifiées ou supprimées partent, donc deux appareils ne s'écrasent pas.
let busy = false, tried = -1, timer = 0, failMsg = ""; // tried : numéro (rev) de la modification locale au dernier envoi tenté
async function publish(){
  if(!FB || busy || pend.replace || !canEdit()) return; computePend(); const n = nPend(); if(!n) return;
  busy = true; tried = rev;
  const sent = {up:{...pend.up}, del:pend.del.slice()}, maj = new Date().toISOString(), strip = ({id,...o}) => o;
  try {
    const u = {maj}; for(const o of Object.values(sent.up)) u["seances/"+o.id] = strip(o); for(const id of sent.del) u["seances/"+id] = null;
    await fbWrite(u);
    failMsg = ""; needLogin = false; setBase(applyPend(base, sent).slice(), maj); busy = false; save(); // save() recalcule ce qui a pu changer pendant l'envoi
  } catch(e) { busy = false; needLogin = !!e.login; failMsg = e instanceof TypeError ? "pas de connexion à la base en ligne" : e.message; if(needLogin) $("addbox").open = true; }
  loginUi(); syncBar();
}
// Le bandeau n'apparaît que si un envoi a échoué ; en temps normal il n'y a rien à faire ni à voir.
function syncBar(){
  if(!FB){ $("sync").hidden = true; return; }
  computePend(); const n = pend.replace ? 0 : nPend();
  $("sync").hidden = !(n && failMsg && !busy);
  $("syncTxt").textContent = `${plur(n,"modification pas encore envoyée","modifications pas encore envoyées")} en ligne : ${failMsg}.` + (needLogin ? " Connectez-vous en bas de la page." : " Elles restent enregistrées dans ce navigateur.");
  $("pub").hidden = needLogin; if(!n) failMsg = "";
  clearTimeout(timer); if(n && canEdit() && !busy && rev!==tried) timer = setTimeout(publish, 1200); // envoi peu après chaque modification
  loginUi();
}
function loginUi(){
  const ed = canEdit(), d = online && online.maj ? " du "+DT.format(new Date(online.maj)) : "";
  document.body.classList.toggle("ro", !ed);
  $("boxTitle").textContent = ed ? "Ajouter, modifier ou importer des séances" : "Modifier les séances";
  $("fbInfo").textContent = !FB ? "Les séances sont enregistrées dans ce navigateur."
    : !ed ? "Cet appareil affiche les séances en lecture seule."
    : "Les séances sont en ligne : toute personne qui a le lien les voit, et vos modifications sont envoyées toutes seules." + (online ? ` Version en ligne${d} : ${plur(online.n,"séance","séances")}.` : "");
  $("lockLine").hidden = !FB || !!auth; $("lock").textContent = ed ? "Repasser cet appareil en lecture seule" : "Modifier les séances sur cet appareil";
  $("login").hidden = !FB || !!auth || !needLogin; $("logged").hidden = !auth; $("who").textContent = auth ? `Connecté : ${auth.email}.` : "";
}
$("lock").onclick = () => { const ed = !canEdit(); jset(EDIT, ed); if(!ed){ picked.clear(); if(editing) resetForm(); } tried = -1; render(); };
$("login").onsubmit = async e => {
  e.preventDefault(); $("logBtn").disabled = true; $("logMsg").textContent = "Connexion…";
  try { await signIn($("logEmail").value.trim(), $("logPwd").value); $("logPwd").value = ""; $("logMsg").textContent = ""; needLogin = false; failMsg = ""; tried = -1; render(); }
  catch(err) { $("logMsg").textContent = "Connexion impossible : " + (err instanceof TypeError ? "pas de connexion à Firebase" : err.message) + "."; }
  $("logBtn").disabled = false;
};
$("logout").onclick = () => { auth = null; jset(AUTH, null); tried = -1; render(); $("logMsg").textContent = "Déconnecté."; };
$("pub").onclick = () => { tried = -1; publish(); };
document.addEventListener("visibilitychange", () => { if(!document.hidden && !busy && !editing) refresh(); }); // en revenant sur l'onglet : relire la version en ligne, renvoyer ce qui attend

render();
refresh().then(() => { if(!seances.length) $("addbox").open = true; });
</script>
